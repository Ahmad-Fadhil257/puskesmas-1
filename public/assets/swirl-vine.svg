<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none" class="swirl-vine-ornament">
    <!-- Root Base flaring to firmly anchor onto the bottom border ("Nempel" ke garis bawah) -->
    <path d="M 380 360 C 390 310 425 270 470 240 C 515 210 560 215 580 170 C 600 120 570 60 510 45 C 440 30 380 85 390 155 C 400 215 460 250 515 235 C 555 220 570 175 550 140 C 535 115 500 120 495 145 C 490 165 510 175 520 165" 
          stroke="#006346" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Additional Base Root anchor line creating a grounded trunk feel -->
    <path d="M 420 360 C 430 330 450 300 480 280 C 520 255 565 270 595 240" 
          stroke="#006346" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Prominent Organic Floral Circle inside Spiral (Like image.png) -->
    <circle cx="522" cy="155" r="24" fill="#006346"/>
    <circle cx="522" cy="155" r="15" fill="none" stroke="#006346" stroke-width="2" opacity="0.6"/>

    <!-- Inner Spiral Swirl -->
    <path d="M 522 135 C 540 135 552 148 548 163 C 544 175 530 182 518 178 C 510 174 506 164 510 156 C 513 150 521 148 525 152" 
          stroke="#006346" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Airy Upper Swirling Branch (Lebih renggang & tidak berdempetan) -->
    <path d="M 430 190 C 390 140 370 80 410 40 C 445 5 490 15 480 50 C 470 75 440 80 430 65 C 425 55 435 45 445 50" 
          stroke="#006346" stroke-width="3" stroke-linecap="round"/>

    <!-- Delicate Whimsical Swirling Arch to the Left (Spacious, flowing curve) -->
    <path d="M 390 280 C 330 250 290 190 310 130 C 330 80 375 75 365 110 C 355 135 325 135 315 115 C 310 100 325 90 335 95" 
          stroke="#006346" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small Airy Tendril -->
    <path d="M 320 200 C 270 210 240 250 260 290 C 275 320 310 325 325 300 C 335 280 315 270 305 280" 
          stroke="#006346" stroke-width="2" stroke-linecap="round"/>

    <!-- Top Crown Spiral -->
    <path d="M 525 48 C 540 20 570 10 590 25 C 605 35 605 60 585 70 C 570 78 555 68 560 55" 
          stroke="#006346" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Edge Flourish -->
    <path d="M 585 155 C 610 170 630 150 620 130 C 610 115 590 120 595 135" 
          stroke="#006346" stroke-width="2" stroke-linecap="round"/>

    <!-- BOTANICAL LEAVES (Rapi, Seimbang & Tidak Menumpuk) -->
    <!-- Lower stem leaf -->
    <path d="M 405 305 C 375 295 375 265 405 270 C 420 288 415 300 405 305 Z" fill="#006346"/>
    <!-- Mid branch leaves -->
    <path d="M 460 215 C 435 190 450 165 475 180 C 475 205 465 215 460 215 Z" fill="#006346"/>
    <path d="M 360 145 C 335 125 345 100 370 110 C 375 130 365 145 360 145 Z" fill="#006346"/>
    <path d="M 430 95 C 410 70 430 45 450 60 C 450 80 435 95 430 95 Z" fill="#006346"/>
    
    <!-- Outer spiral leaves -->
    <path d="M 570 95 C 600 75 615 95 595 115 C 580 110 575 100 570 95 Z" fill="#006346"/>
    <path d="M 570 235 C 595 245 590 270 565 265 C 560 250 565 240 570 235 Z" fill="#006346"/>
    <path d="M 505 255 C 515 285 490 300 480 280 C 485 265 495 255 505 255 Z" fill="#006346"/>

    <!-- Warm Orange Accent Berries (Harmonis & Elegan) -->
    <circle cx="445" cy="50" r="4.5" fill="#E8672C"/>
    <circle cx="335" cy="95" r="4" fill="#E8672C"/>
    <circle cx="585" cy="70" r="4" fill="#E8672C"/>
    <circle cx="260" cy="290" r="3.5" fill="#E8672C"/>
    <circle cx="595" cy="135" r="3.5" fill="#E8672C"/>
</svg>
